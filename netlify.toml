[build]
  publish = "."
  functions = "netlify/functions"

# página de download e PDF: não aparecem no Google
[[headers]]
  for = "/acesso-tiohk45cmr/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "private, max-age=0"

# endereço antigo .netlify.app -> domínio próprio
[[redirects]]
  from = "https://carlareceitasnaturais.netlify.app/*"
  to = "https://carlareceitasnaturais.com/:splat"
  status = 301
  force = true
